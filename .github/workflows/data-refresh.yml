name: Refresh NYC data

# Re-pulls the live NYC Open Data sources, regenerates the display JSON, and —
# if anything changed — opens a PR (direct pushes to main are blocked by the
# repo ruleset). Runs monthly; can also be triggered by hand.
#
#   311  (erm2-nwe9) updates daily; we fold the new month into the committed
#        aggregate cache incrementally.
#   sales (w2pb-icbu) updates ~annually; the full Brooklyn pull is cheap and a
#        content hash makes runs where nothing changed a no-op.
#
# Auth (raises the NYC Open Data rate limit) reads, in order of preference:
#   - SOCRATA_APP_KEY_ID + SOCRATA_APP_KEY_SECRET (API key, Basic Auth — current)
#   - SOCRATA_APP_TOKEN (legacy app token — fallback)
# Set whichever you use as repo secrets. https://support.socrata.com/hc/en-us/articles/360015776014-API-Keys

on:
  schedule:
    - cron: '0 6 2 * *' # 06:00 UTC on the 2nd of each month
  workflow_dispatch:
    inputs:
      backfill_311:
        description: 'Rebuild the 311 aggregate cache from full history (slow)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Refresh Brooklyn sales
        env:
          SOCRATA_APP_KEY_ID: ${{ secrets.SOCRATA_APP_KEY_ID }}
          SOCRATA_APP_KEY_SECRET: ${{ secrets.SOCRATA_APP_KEY_SECRET }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npm run data:build:brooklyn

      - name: Refresh 311 (incremental)
        if: ${{ !inputs.backfill_311 }}
        env:
          SOCRATA_APP_KEY_ID: ${{ secrets.SOCRATA_APP_KEY_ID }}
          SOCRATA_APP_KEY_SECRET: ${{ secrets.SOCRATA_APP_KEY_SECRET }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npm run data:build:311

      - name: Refresh 311 (full backfill)
        if: ${{ inputs.backfill_311 }}
        env:
          SOCRATA_APP_KEY_ID: ${{ secrets.SOCRATA_APP_KEY_ID }}
          SOCRATA_APP_KEY_SECRET: ${{ secrets.SOCRATA_APP_KEY_SECRET }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: npm run data:build:311 -- --backfill

      - name: Open PR if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data scripts/etl/311/cache; then
            echo "No data changes — nothing to do."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="data/refresh-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force-create + force-push so a same-day re-run (manual dispatch on the
          # cron day, or a retried job) overwrites its own branch instead of
          # aborting with "a branch with that name already exists".
          git switch -C "$BRANCH"
          git add public/data scripts/etl/311/cache
          git commit -m "data: monthly NYC refresh (${DATE})"
          git push -u --force-with-lease origin "$BRANCH"
          # Reuse the existing PR if this branch already has one open (re-run case).
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create \
              --title "data: NYC refresh (${DATE})" \
              --body "Automated refresh of Brooklyn sales + NYC 311 display data from NYC Open Data. Generated by \`.github/workflows/data-refresh.yml\`." \
              --base main --head "$BRANCH"
          else
            echo "PR for $BRANCH already open — pushed updated data to it."
          fi
