name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.astro"

jobs:
  claude-review:
    # Only review PRs from collaborators. A fork PR from a random user must not
    # be able to spin up Claude on our account.
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed to post the review as a PR comment (gh pr comment)
      issues: write # PR comments are issue comments — also needs write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request against the guidance in CLAUDE.md,
            docs/MIGRATION.md, and docs/ARCHITECTURE.md. This repo is mid-migration
            from a 2015-era Ezel/Backbone/CoffeeScript/D3-v3 stack to Astro 6 +
            React 19 islands + TypeScript + D3 v7. Prioritize, in order:
            1. Correctness bugs (D3 v3→v7 symbol mapping, Astro island hydration,
               TypeScript errors, dropped promises). Flag any new features added to
               the legacy stack — only migration is allowed.
            2. The "D3 owns the math, React owns the DOM" rule: never let
               `d3.select(...).append(...)` mutate nodes React also manages.
            3. URL/compatibility contract — `/`, `/brooklyn`, `/311`, `/chicago`,
               `/north-carolina` and legacy graph-key deep-link/query states must
               keep resolving (CLAUDE.md §3, MIGRATION.md §3).
            4. Security: secrets handling (never re-add the leaked AWS keys), env
               var leaks, deploy-key scope.
            5. Data handling — display JSON is fetched from `public/data/<app>/`,
               not bundled, and is regenerated from the live NYC Open Data APIs by
               `scripts/etl/` (the legacy 12 MB `bbl-to-lat-long.json` geocode join
               is retired — sales arrive pre-geocoded to 2020 NTAs). See docs/etl.md.
            6. Test coverage for new behavior (Vitest for pure math, Playwright smoke).

            Skip stylistic nits already covered by ESLint, Prettier, or Tailwind.
            Prefix preferential feedback with "(nit)". Post one consolidated review.

          # Let the action manage the review comment itself (via the GitHub API +
          # GITHUB_TOKEN): it creates/updates a tracking comment and hands Claude
          # the PR context + comment tool natively. This replaces the previous
          # `gh pr comment` approach, which silently failed — in the headless run
          # every `gh` Bash call was denied ("haven't granted it yet"), so Claude
          # could neither read the diff nor post, while the job still exited green.
          track_progress: true

          # Surface Claude's output in the run log so silent failures (e.g.
          # permission denials) are visible instead of hidden behind a green check.
          show_full_output: true

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # Read/Grep/Glob are required: the prompt asks Claude to review against
          # CLAUDE.md and docs/, and without them every file read is denied and
          # the review dies before it can write anything. The comment is posted by
          # the action (track_progress), so no `gh`/Bash tools are needed here.
          claude_args: '--allowed-tools "Read,Grep,Glob"'
